
services:
  web:
    container_name: calculator_olesya_5007
    build:
      context: ./Calculator
    restart: always
    ports:
      - "5007:5007"
    environment:
      ConnectionStrings__DefaultConnection: "Server=calculator_mariadb;Port=3306;Database=calculator_db;User=calculator_user;Password=calculator_password;"
      Kafka__BootstrapServers: "kafka-kafka-1:9092"
    networks:
      - mariadbnet
      - kafkanet

networks:
  mariadbnet:
    external: true
  kafkanet:
    external: true
